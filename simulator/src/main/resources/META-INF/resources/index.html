<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitzplatzreservierung</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><h1>Sitzplatzreservierung</h1>
  <nav><a href="index.html" aria-current="page">Reservieren</a><a href="szenarien.html">Szenarien</a></nav></header>
<main>
  <div class="stack">
    <section aria-labelledby="h-req">
      <h2 id="h-req">Reservierungsanfrage</h2>
      <label for="wagen">Wagen (Wagenlayout)</label>
      <select id="wagen"></select>
      <label for="ebene" id="ebenel" hidden>Ebene</label>
      <select id="ebene" hidden></select>
      <label for="from">Einstieg</label>
      <select id="from"></select>
      <label for="to">Ausstieg</label>
      <select id="to"></select>
      <label for="party">Personen (1–8)</label>
      <input id="party" type="number" min="1" max="8" value="1">
      <div class="checks">
        <label><input type="checkbox" id="quiet"> Ruhezone</label>
        <label><input type="checkbox" id="kids"> Familie mit Kindern</label>
        <label><input type="checkbox" id="wheelchair"> Rollstuhlplatz</label>
        <label><input type="checkbox" id="bike"> Fahrradstellplatz</label>
      </div>
      <label for="when">Zeitpunkt der Anfrage (leer = jetzt)</label>
      <input id="when" type="datetime-local">
      <div class="btns">
        <button class="primary" id="btn-propose" type="button">Vorschlag anzeigen</button>
        <button id="btn-confirm" type="button" disabled>Bestätigen</button>
      </div>
      <p id="msg" role="status" aria-live="polite"></p>
      <p id="timer"></p>
    </section>
    <section aria-labelledby="h-hist">
      <h2 id="h-hist">Reservierungen</h2>
      <ul class="hist" id="hist"></ul>
      <div class="btns"><button id="btn-reset" type="button">Alle zurücksetzen</button></div>
    </section>
  </div>
  <section aria-labelledby="h-sitzplan">
    <h2 id="h-sitzplan">Wagenplan</h2>
    <div class="route" id="route" aria-label="Strecke"></div>
    <div class="scroll"><svg id="sitzplan" role="group" aria-label="Wagenplan"></svg></div>
    <div class="legend">
      <span><b style="background:var(--avail);border-color:var(--avail-stroke)"></b>verfügbar</span>
      <span><b style="background:var(--prop);border-color:var(--prop-stroke)"></b>Vorschlag / gewählt</span>
      <span><b style="background:var(--taken);border-color:var(--taken-stroke)"></b>belegt auf der Teilstrecke</span>
      <span><b style="background:var(--held);border-color:var(--held-stroke);border-style:dotted"></b>von anderer Anfrage vorgemerkt</span>
      <span><b style="background:var(--group);border-color:var(--group-stroke);border-style:dashed"></b>für Gruppen reserviert</span>
      <span><b style="background:var(--other);border-color:var(--other-stroke)"></b>andere Zone, Sonderplatz nicht angefordert</span>
      <span><b style="background:var(--ruhe);border-color:var(--border)"></b>Ruhebereich</span>
      <span><b style="background:var(--kinder);border-color:var(--border)"></b>Familien- und Kleinkindbereich</span>
    </div>
  </section>
</main>
<script src="wagenplan.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = { wagen: null, sitzplan: null, gewaehlt: new Set(), vormerkToken: null, ablauf: null };

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.fehler || ("Fehler " + res.status)), { status: res.status });
  return body;
}

function say(text, kind) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = kind || "";
}

function timestamp() {
  const v = $("when").value;
  return v ? new Date(v).toISOString() : null;
}

function segment() {
  return { einstiegHalt: Number($("from").value), ausstiegHalt: Number($("to").value) };
}

function halteBefuellen() {
  const stops = state.wagen.halte;
  const from = Number($("from").value || 0);
  $("from").innerHTML = stops.slice(0, -1).map((s, i) => `<option value="${i}">${s}</option>`).join("");
  $("from").value = Math.min(from, stops.length - 2);
  ausstiegBefuellen();
}

function ausstiegBefuellen() {
  const stops = state.wagen.halte;
  const from = Number($("from").value);
  const prev = Number($("to").value);
  $("to").innerHTML = stops.map((s, i) => i > from ? `<option value="${i}">${s}</option>` : "").join("");
  $("to").value = prev > from ? prev : stops.length - 1;
}

function streckeZeichnen() {
  const { einstiegHalt, ausstiegHalt } = segment();
  const parts = [];
  state.wagen.halte.forEach((s, i) => {
    if (i > 0) parts.push(`<div class="leg ${i > einstiegHalt && i <= ausstiegHalt ? "on" : ""}"></div>`);
    parts.push(`<div class="stop ${i >= einstiegHalt && i <= ausstiegHalt ? "on" : ""}"><i></i>${s}</div>`);
  });
  $("route").innerHTML = parts.join("");
}

function request() {
  return {
    gruppengroesse: Number($("party").value),
    wuenschtRuhezone: $("quiet").checked,
    wuenschtRollstuhlplatz: $("wheelchair").checked, wuenschtFahrradplatz: $("bike").checked, mitKindern: $("kids").checked,
    ...segment(), vormerkToken: state.vormerkToken, anfragezeitpunkt: timestamp()
  };
}

function query() {
  const r = request();
  const q = new URLSearchParams({ einstiegHalt: r.einstiegHalt, ausstiegHalt: r.ausstiegHalt, gruppengroesse: r.gruppengroesse, wuenschtRuhezone: r.wuenschtRuhezone,
    wuenschtRollstuhlplatz: r.wuenschtRollstuhlplatz, wuenschtFahrradplatz: r.wuenschtFahrradplatz, mitKindern: r.mitKindern });
  if (r.anfragezeitpunkt) q.set("anfragezeitpunkt", r.anfragezeitpunkt);
  if (state.vormerkToken) q.set("vormerkToken", state.vormerkToken);
  return q.toString();
}

function render() {
  Wagenplan.zeichnen($("sitzplan"), state.sitzplan, { gewaehlt: state.gewaehlt });
  $("btn-confirm").disabled = !(state.vormerkToken && state.gewaehlt.size > 0 && state.gewaehlt.size === erwartet());
}

/* Erwartete Platzzahl: Gruppengröße; der Fahrradstellplatz kommt zusätzlich hinzu */
function erwartet() {
  return Number($("party").value) + ($("bike").checked ? 1 : 0);
}

async function sitzUmschalten(id) {
  const seat = state.sitzplan.sitzplaetze.find((s) => s.id === id);
  if (!seat || seat.zustand !== "FREI") return;
  const n = erwartet();
  const next = new Set(state.gewaehlt);
  if (next.has(id)) next.delete(id);
  else {
    if (next.size >= n) next.delete(next.values().next().value);
    next.add(id);
  }
  await vormerkungSetzen([...next]);
  say(`${state.gewaehlt.size} von ${n} Plätzen gewählt.`);
}

/* Ersetzt die serverseitige Vormerkung durch die angegebenen Sitzplätze und übernimmt Sitzplan, Token und Ablaufzeit */
async function vormerkungSetzen(sitzIds) {
  const r = request();
  const sitzplan = await api(`/api/v1/wagen/${state.wagen.id}/vormerkung`, {
    method: "POST",
    body: JSON.stringify({ vormerkToken: state.vormerkToken, sitzIds, gruppengroesse: r.gruppengroesse, wuenschtRuhezone: r.wuenschtRuhezone,
      wuenschtRollstuhlplatz: r.wuenschtRollstuhlplatz, wuenschtFahrradplatz: r.wuenschtFahrradplatz, mitKindern: r.mitKindern, einstiegHalt: r.einstiegHalt, ausstiegHalt: r.ausstiegHalt, anfragezeitpunkt: r.anfragezeitpunkt })
  });
  sitzplanUebernehmen(sitzplan);
}

function sitzplanUebernehmen(sitzplan) {
  state.sitzplan = sitzplan;
  state.vormerkToken = sitzplan.vormerkToken;
  state.ablauf = sitzplan.vormerkungAblauf ? new Date(sitzplan.vormerkungAblauf).getTime() : null;
  state.gewaehlt = new Set(sitzplan.vorgeschlagen);
  render();
  tick();
}

/* Gibt eine bestehende Vormerkung frei und verwirft Auswahl und Token */
async function vormerkungVerwerfen() {
  if (state.vormerkToken && state.gewaehlt.size) {
    try { await vormerkungSetzen([]); } catch (e) { /* abgelaufen oder bereits frei */ }
  }
  state.vormerkToken = null;
  state.ablauf = null;
  state.gewaehlt.clear();
  tick();
}

function tick() {
  const el = $("timer");
  if (!state.ablauf || !state.gewaehlt.size) { el.textContent = ""; el.className = ""; return; }
  const left = Math.ceil((state.ablauf - Date.now()) / 1000);
  if (left <= 0) {
    state.ablauf = null;
    state.vormerkToken = null;
    state.gewaehlt.clear();
    el.textContent = "";
    say("Die Vormerkung ist abgelaufen. Bitte einen neuen Vorschlag anfordern.", "err");
    sitzplanAktualisieren(true).catch(() => {});
    return;
  }
  el.textContent = `Sitzplätze vorgemerkt, noch ${left} s bis zum Ablauf`;
  el.className = left <= 10 ? "low" : "";
}
setInterval(tick, 500);

$("sitzplan").addEventListener("click", (e) => {
  const g = e.target.closest(".platz");
  if (g) sitzUmschalten(g.dataset.id);
});
$("sitzplan").addEventListener("keydown", (e) => {
  const g = e.target.closest(".platz");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sitzUmschalten(g.dataset.id); }
});

async function sitzplanAktualisieren(keepPicks) {
  if (!keepPicks) await vormerkungVerwerfen();
  streckeZeichnen();
  const sitzplan = await api(`/api/v1/wagen/${state.wagen.id}/sitzplan?${query()}`);
  state.sitzplan = sitzplan;
  render();
}

async function reservierungenAktualisieren() {
  const list = await api(`/api/v1/wagen/${state.wagen.id}/reservierungen`);
  const stops = state.wagen.halte;
  $("hist").innerHTML = list.length
    ? list.slice().reverse().map((r) => `<li><b>${r.gruppengroesse} ${r.gruppengroesse === 1 ? "Person" : "Personen"}</b> · ${stops[r.einstiegHalt]} → ${stops[r.ausstiegHalt]}
        <small>Sitze ${r.sitzIds.map(kurz).join(", ")} · ${new Date(r.erstelltAm).toLocaleTimeString("de-DE")} · ${r.reservierungId.slice(0, 8)}</small></li>`).join("")
    : `<li class="empty">Noch keine Reservierungen.</li>`;
}

async function guard(fn) {
  try { await fn(); } catch (e) { say(e.message, "err"); if (e.status === 409) { state.vormerkToken = null; state.ablauf = null; state.gewaehlt.clear(); await sitzplanAktualisieren(true).catch(() => {}); } }
}

$("btn-propose").addEventListener("click", () => guard(async () => {
  const n = Number($("party").value);
  if (!(n >= 1 && n <= 8)) throw new Error("Personenzahl muss zwischen 1 und 8 liegen.");
  const sitzplan = await api(`/api/v1/wagen/${state.wagen.id}/vorschlag`, { method: "POST", body: JSON.stringify(request()) });
  streckeZeichnen();
  sitzplanUebernehmen(sitzplan);
  if (sitzplan.vorgeschlagen.length) say(`Vorschlag: ${sitzplan.vorgeschlagen.map(kurz).join(", ")}. Sitze anklicken zum Ändern, dann bestätigen.`);
  else say(sitzplan.meldung || "Kein Vorschlag.", "err");
}));

$("btn-confirm").addEventListener("click", () => guard(async () => {
  const r = request();
  const res = await api(`/api/v1/wagen/${state.wagen.id}/bestaetigung`, {
    method: "POST",
    body: JSON.stringify({ sitzIds: [...state.gewaehlt], einstiegHalt: r.einstiegHalt, ausstiegHalt: r.ausstiegHalt, vormerkToken: state.vormerkToken, anfragezeitpunkt: r.anfragezeitpunkt })
  });
  state.vormerkToken = null;
  state.ablauf = null;
  state.gewaehlt.clear();
  say(`Reserviert: ${res.sitzIds.map(kurz).join(", ")} (${state.wagen.halte[res.einstiegHalt]} → ${state.wagen.halte[res.ausstiegHalt]}).`, "ok");
  await sitzplanAktualisieren(false);
  await reservierungenAktualisieren();
}));

$("btn-reset").addEventListener("click", () => guard(async () => {
  if (!confirm("Alle Reservierungen dieses Wagens löschen?")) return;
  await api(`/api/v1/wagen/${state.wagen.id}/reservierungen`, { method: "DELETE" });
  say("Alle Reservierungen gelöscht.", "ok");
  await sitzplanAktualisieren(false);
  await reservierungenAktualisieren();
}));

$("from").addEventListener("change", () => guard(async () => { ausstiegBefuellen(); await sitzplanAktualisieren(false); }));
$("quiet").addEventListener("change", () => { if ($("quiet").checked) $("kids").checked = false; });
$("kids").addEventListener("change", () => { if ($("kids").checked) $("quiet").checked = false; });
for (const id of ["to", "party", "quiet", "kids", "wheelchair", "bike", "when"])
  $(id).addEventListener("change", () => guard(() => sitzplanAktualisieren(false)));

$("wagen").addEventListener("change", () => guard(() => wagenLaden($("wagen").value)));

const kurz = (id) => Wagenplan.kurz(state.wagen.id, id);

async function wagenLaden(id) {
  state.wagen = await api(`/api/v1/wagen/${id}`);
  await Wagenplan.vorbereiten($("sitzplan"), id, $("ebene"));
  $("from").innerHTML = "";
  halteBefuellen();
  say("");
  await sitzplanAktualisieren(false);
  await reservierungenAktualisieren();
}

/* Fremde Vormerkungen und Reservierungen sichtbar machen, ohne die eigene Auswahl zu verwerfen */
setInterval(() => { if (state.wagen && !document.hidden) sitzplanAktualisieren(true).catch(() => {}); }, 5000);

guard(async () => {
  const carriages = await api("/api/v1/wagen");
  $("wagen").innerHTML = carriages.map((c) => `<option value="${c.id}">${c.id} · ${c.zugnummer}</option>`).join("");
  /* Vorbelegung über die Adresse: ?wagen=... */
  const start = carriages.find((c) => c.id === new URLSearchParams(location.search).get("wagen")) || carriages[0];
  if (carriages.length) { $("wagen").value = start.id; await wagenLaden(start.id); }
  else say("Keine Wagen vorhanden.", "err");
});
</script>
</body>
</html>
