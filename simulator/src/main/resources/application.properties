quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

zuteilung.gewicht.streuung=1.5
zuteilung.gewicht.kohaesion=2.5

# Timeout für die Wagensperre (Lock-Akquisition) in Millisekunden
zuteilung.sperre.timeout-millisekunden=2000

# Topologieschutz: Mindestgröße der größten freien Restkomponente
zuteilung.topologie.mindestgroesse=3

# Strahlbreite der Sitzgruppen-Suche (max. Teilmengen je Stufe)
zuteilung.suche.strahlbreite=5000

# Dauer der temporären Vormerkung nach Vorschlag oder Umwahl in Sekunden
zuteilung.vormerkung.sekunden=30

# Bonus für Familien mit Kindern im Kinderbereich (Anteil der Sitzplätze der Gruppe)
zuteilung.gewicht.kinderbereich=3.0

# Verzeichnis der Szenario-Dateien (JSON, eine Datei je Szenario)
zuteilung.szenarien.verzeichnis=szenarien

# Optionales Verzeichnis mit eigenen Wagenlayouts (*.json) zusätzlich zu den mitgelieferten Beispielen
#wagenlayouts.verzeichnis=layouts

# Profil "demo": eigenständige Demo mit eingebetteter H2-Datenbank (In-Memory) und Testdaten aus import.sql.
# Gebaut wird sie mit "mvn package -Pdemo"; die Datenbank wird bei jedem Start neu angelegt.
%demo.quarkus.datasource.db-kind=h2
%demo.quarkus.datasource.jdbc.url=jdbc:h2:mem:seats;DB_CLOSE_DELAY=-1
%demo.quarkus.datasource.devservices.enabled=false
# Nur lokal erreichbar; für den Zugriff aus dem Netz mit -Dquarkus.http.host=0.0.0.0 starten
%demo.quarkus.http.host=127.0.0.1
