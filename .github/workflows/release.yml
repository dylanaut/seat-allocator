name: Release

# Ein Release entsteht durch einen Tag der Form vMAJOR.MINOR.PATCH (z. B. v1.0.0) auf einem Commit von main.
# Die Version im POM wird beim Build aus dem Tag gesetzt und nicht eingecheckt.
# Ablauf: bauen (Anwendung, Demo, Dokumentation) -> Demo auf Linux, macOS und Windows testen -> veröffentlichen.
# Manuell gestartet (workflow_dispatch) wird nur gebaut und getestet, ohne Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version für den Probelauf (z. B. 1.0.0-rc.1)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: read

jobs:
  build:
    name: Release bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${EINGABE}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Ungültige Version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Tag muss auf main liegen
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Der Tag ${GITHUB_REF_NAME} liegt nicht auf main."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version setzen
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build, Tests und Dokumentation
        run: mvn -B -ntp verify

      - name: Verteilung (Postgres-Variante) zusammenstellen
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="seat-allocator-${VERSION}"
          mkdir -p "dist/${NAME}"
          cp -r target/quarkus-app/. "dist/${NAME}/"
          cp -r szenarien "dist/${NAME}/szenarien"
          cp README.md "dist/${NAME}/"
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          rm -rf "dist/${NAME}"
          cp "target/generated-docs/${NAME}.pdf" "target/generated-docs/${NAME}.html" dist/

      # Plattformunabhängiges Uber-Jar mit H2 und Testdaten plus Startskripten (Tests liefen oben bereits)
      - name: Demo bauen
        run: |
          mvn -B -ntp -Pdemo package -DskipTests
          cp "target/seat-allocator-demo-${{ steps.version.outputs.version }}.zip" dist/
          ls -l dist

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: seat-allocator-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  demo-test:
    name: Demo testen (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Nur ein JRE/JDK 21, keine Projektquellen: Die Demo muss mit dem ZIP allein laufen
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v8
        with:
          name: seat-allocator-${{ needs.build.outputs.version }}
          path: dist

      - name: Demo starten und prüfen (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          unzip -q "seat-allocator-demo-${VERSION}.zip"
          cd "seat-allocator-demo-${VERSION}"
          test -x start.sh
          NO_BROWSER=1 PORT=18080 ./start.sh > ../demo.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/api/v1/wagen | grep -q '"W1"'; then OK=1; break; fi
            sleep 2
          done
          kill "${PID}" 2>/dev/null || true
          if [[ "${OK}" != "1" ]]; then cat ../demo.log; exit 1; fi
          echo "Demo läuft"

      - name: Demo starten und prüfen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Expand-Archive -Path "seat-allocator-demo-$env:VERSION.zip" -DestinationPath .
          $dir = Join-Path (Get-Location) "seat-allocator-demo-$env:VERSION"
          $env:NO_BROWSER = "1"; $env:NO_PAUSE = "1"; $env:PORT = "18080"
          $p = Start-Process -FilePath cmd.exe -ArgumentList "/c", "start.cmd" -WorkingDirectory $dir -PassThru `
                 -RedirectStandardOutput "$dir\..\demo.log" -RedirectStandardError "$dir\..\demo-err.log"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:18080/api/v1/wagen" -TimeoutSec 5
              if ($r.Content -like '*"W1"*') { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ok) { Get-Content "$dir\..\demo.log", "$dir\..\demo-err.log"; exit 1 }
          Write-Host "Demo läuft"

  publish:
    name: Veröffentlichen
    if: github.ref_type == 'tag'
    needs: [build, demo-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: seat-allocator-${{ needs.build.outputs.version }}
          path: dist

      - name: GitHub Release anlegen
        run: |
          FLAGS=(--title "Release ${VERSION}" --generate-notes --verify-tag)
          if [[ "${VERSION}" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${FLAGS[@]}"
