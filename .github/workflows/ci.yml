name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Tests und Dokumentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Die Tests nutzen Quarkus Dev Services (PostgreSQL per Docker, auf ubuntu-latest vorhanden)
      - name: Build, Tests und Dokumentation (PDF, HTML)
        run: mvn -B -ntp verify

      # Stellt sicher, dass sich die eigenständige Demo (H2, Startskripte) bauen lässt
      - name: Demo bauen
        run: mvn -B -ntp -Pdemo package -DskipTests

      - name: Demo hochladen
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: simulator/target/seat-allocator-demo-*.zip
          if-no-files-found: error

      - name: Dokumentation hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dokumentation
          path: simulator/target/generated-docs/*
          if-no-files-found: warn

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testberichte
          path: simulator/target/surefire-reports/
