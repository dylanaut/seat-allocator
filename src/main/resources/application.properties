quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

zuteilung.gewicht.praeferenz=1.0
zuteilung.gewicht.streuung=1.5
zuteilung.gewicht.kohaesion=2.5

# Timeout für Lock-Akquisition in Millisekunden (z. B. 2 Sekunden)
quarkus.hibernate-orm.unsupported-properties."jakarta.persistence.lock.timeout"=2000

# Zeitverfall-Malus für Einzelreisende an Tischen und Vorlaufzeit bis zur Freigabefrist
zuteilung.gewicht.zeitverfall=3.0
zuteilung.zeitverfall.horizont-stunden=24

# Topologieschutz: Mindestgröße der größten freien Restkomponente
zuteilung.topologie.mindestgroesse=3

# Strahlbreite der Sitzgruppen-Suche (max. Teilmengen je Stufe)
zuteilung.suche.strahlbreite=5000

# Dauer der temporären Vormerkung nach Vorschlag oder Umwahl in Sekunden
zuteilung.vormerkung.sekunden=30

# Bonus für Familien mit Kindern im Kinderbereich (Anteil der Sitzplätze der Gruppe)
zuteilung.gewicht.kinderbereich=3.0

# Verzeichnis der Szenario-Dateien (JSON, eine Datei je Szenario)
zuteilung.szenarien.verzeichnis=szenarien
